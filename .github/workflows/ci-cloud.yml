name: CI Cloud
on:
  pull_request:
    paths: ["cloud/**"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r cloud/requirements.txt
      - run: ruff check cloud
      - run: pytest cloud/tests -q
